{% extends 'base.html' %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="auth">
  <h1>用户注册</h1>
  <form method="post">
    <label>用户名<input name="username" required></label>
    <label>密码<input type="password" name="password" required></label>
    <button type="submit">注册</button>
  </form>
</section>
{% endblock %}
