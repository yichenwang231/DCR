{% extends 'base.html' %}
{% block content %}
<div class="auth-card mx-auto p-4">
  <h3 class="mb-3">登录</h3>
  <form method="post" class="vstack gap-3">
    <input class="form-control" name="username" placeholder="用户名" required>
    <input class="form-control" name="password" type="password" placeholder="密码" required>
    <button class="btn btn-primary">登录</button>
    <small class="text-secondary">默认管理员：admin / admin123</small>
  </form>
</div>
{% endblock %}
